<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育数据看板 - 测试上传</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #1a1a1a; margin-bottom: 10px; }
        .upload-box {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-box:hover {
            border-color: #007bff;
            background: #f8f9ff;
        }
        .upload-box.dragover {
            border-color: #007bff;
            background: #e8f0ff;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .btn:hover { background: #0056b3; }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover { background: #545b62; }
        #fileList {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            display: none;
        }
        .file-item {
            padding: 10px;
            background: white;
            border-radius: 4px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-name { font-weight: 500; }
        .file-status { font-size: 13px; }
        .file-status.success { color: #28a745; }
        .file-status.error { color: #dc3545; }
        .log {
            background: #1a1a1a;
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
            display: none;
        }
        .log-line { margin: 4px 0; }
        #status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            display: none;
        }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }
        .status-info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 教育数据看板 - 上传测试</h1>
        <p>此页面用于测试 Excel 文件上传功能</p>
        
        <div class="upload-box" id="uploadBox">
            <div style="font-size: 48px; margin-bottom: 10px;">📂</div>
            <h3>点击或拖拽上传 Excel 文件</h3>
            <p style="color: #666; font-size: 13px;">格式：20260316-20260322_作业数据.xlsx</p>
            <input type="file" id="fileInput" accept=".xlsx,.xls" style="display: none;">
        </div>
        
        <div style="text-align: center;">
            <button class="btn" onclick="selectFile()">📁 选择文件</button>
            <button class="btn btn-secondary" onclick="toggleLog()">📋 显示/隐藏日志</button>
        </div>
        
        <div id="status"></div>
        <div id="fileList"></div>
        <div class="log" id="log"></div>
    </div>

    <script>
        // 日志函数
        function log(message) {
            const logDiv = document.getElementById('log');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status-${type}`;
            statusDiv.style.display = 'block';
            setTimeout(() => statusDiv.style.display = 'none', 3000);
        }

        function toggleLog() {
            const logDiv = document.getElementById('log');
            logDiv.style.display = logDiv.style.display === 'none' ? 'block' : 'none';
        }

        function selectFile() {
            log('点击选择文件按钮');
            document.getElementById('fileInput').click();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            log('页面加载完成');
            
            const uploadBox = document.getElementById('uploadBox');
            const fileInput = document.getElementById('fileInput');
            const fileList = document.getElementById('fileList');

            log(`uploadBox: ${uploadBox ? '找到' : '未找到'}`);
            log(`fileInput: ${fileInput ? '找到' : '未找到'}`);

            // 点击上传区域
            uploadBox.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                log('点击上传区域');
                fileInput.click();
            });

            // 文件选择
            fileInput.addEventListener('change', (e) => {
                log('文件选择变化触发');
                log(`Files: ${e.target.files.length}`);
                if (e.target.files.length > 0) {
                    handleFiles(e.target.files);
                }
                fileInput.value = '';
            });

            // 拖拽
            uploadBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadBox.classList.add('dragover');
                log('拖拽进入');
            });

            uploadBox.addEventListener('dragleave', () => {
                uploadBox.classList.remove('dragover');
                log('拖拽离开');
            });

            uploadBox.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadBox.classList.remove('dragover');
                log('文件拖放');
                if (e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            });

            log('事件监听器绑定完成');
        });

        // 处理文件
        async function handleFiles(fileList) {
            log(`handleFiles 被调用，文件数：${fileList.length}`);
            
            for (const file of fileList) {
                log(`处理文件：${file.name} (${file.size} bytes)`);
                
                // 解析文件名
                const dateInfo = parseFileName(file.name);
                if (!dateInfo) {
                    addFileToList(file.name, 'error', '文件名格式错误');
                    showStatus(`文件格式不正确：${file.name}`, 'error');
                    continue;
                }
                log(`文件名解析成功：${JSON.stringify(dateInfo)}`);

                try {
                    const data = await readExcel(file);
                    log(`Excel 解析成功，${data.length} 条记录`);
                    addFileToList(file.name, 'success', `解析成功 (${data.length}条记录)`);
                    showStatus(`✓ 上传成功：${file.name}`, 'success');
                } catch (error) {
                    log(`Excel 解析失败：${error.message}`);
                    addFileToList(file.name, 'error', `解析失败：${error.message}`);
                    showStatus(`✗ 上传失败：${file.name}`, 'error');
                }
            }
        }

        // 解析文件名
        function parseFileName(filename) {
            const match = filename.match(/^(\d{4})(\d{2})(\d{2})-(\d{4})(\d{2})(\d{2})_/);
            if (!match) return null;
            const [, y1, m1, d1, y2, m2, d2] = match;
            return {
                startDate: `${y1}-${m1}-${d1}`,
                endDate: `${y2}-${m2}-${d2}`,
                displayRange: `${m1}/${d1}-${m2}/${d2}`
            };
        }

        // 读取 Excel
        function readExcel(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(sheet);
                        resolve(json);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsArrayBuffer(file);
            });
        }

        // 添加到文件列表
        function addFileToList(filename, status, message) {
            const fileList = document.getElementById('fileList');
            fileList.style.display = 'block';
            
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <span class="file-name">${filename}</span>
                <span class="file-status ${status}">${message}</span>
            `;
            fileList.appendChild(div);
        }
    </script>
</body>
</html>
